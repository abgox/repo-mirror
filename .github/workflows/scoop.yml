name: Mirror for ScoopInstaller

on:
  workflow_dispatch:
  schedule:
    # At minute 50 past every 4th hour.
    - cron: "50 */4 * * *"

concurrency:
  group: mirror-scoop-installer

jobs:
  sync-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: Yikun/hub-mirror-action@master
        with:
          src: github/ScoopInstaller
          dst: gitee/scoop-installer-mirrors
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: org
          force_update: true
          static_list: "Main,Extras,Versions,Nirsoft,PHP,Nonportable,Java,Scoop"
          # static_list: ${{ steps.repo.outputs.repoList }}
          # black_list: ''

      - uses: Yikun/hub-mirror-action@master
        with:
          src: github/matthewjberger
          dst: gitee/scoop-installer-mirrors
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          src_account_type: user
          dst_account_type: org
          force_update: true
          static_list: "scoop-nerd-fonts"

      - uses: Yikun/hub-mirror-action@master
        with:
          src: github/niheaven
          dst: gitee/scoop-installer-mirrors
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          src_account_type: user
          dst_account_type: org
          force_update: true
          static_list: "scoop-sysinternals"

      - uses: Yikun/hub-mirror-action@master
        with:
          src: github/Calinou
          dst: gitee/scoop-installer-mirrors
          dst_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          src_account_type: user
          dst_account_type: org
          force_update: true
          static_list: "scoop-games"

